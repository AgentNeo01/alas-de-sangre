<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Alas de Sangre — el Colegio de Guerra de Basgiath. Intro de la campaña.">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Alas de Sangre &#183; Sesi&oacute;n III</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;800&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<style>
  :root{
    --void:#0c0705; --void2:#160b09;
    --blood:#6b0f12; --blood2:#8c1a1f;
    --gold:#b8862b; --gold2:#e3c072; --goldsoft:#c9a24b;
    --ember:#ff7d33; --ember2:#ffb15a;
    --parch:#efe4cd; --parchdim:#b8a985;
    --disp:'Cinzel', 'Trajan Pro', Georgia, serif;
    --body:'EB Garamond', 'Iowan Old Style', Georgia, serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--void); color:var(--parch);
    font-family:var(--body);
    min-height:100%; overflow-x:hidden; overflow-y:auto;
  }
  /* full-bleed cinematic stage */
  #stage{
    position:relative; z-index:2;
    min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center;
    padding: calc(env(safe-area-inset-top,0px) + 28px) 18px calc(env(safe-area-inset-bottom,0px) + 28px);
  }
  #embers{position:fixed; inset:0; z-index:0; pointer-events:none}
  /* vignette + warm floor glow */
  #stage::before{
    content:""; position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(120% 80% at 50% 118%, rgba(139,26,31,.42), transparent 60%),
      radial-gradient(90% 70% at 50% -10%, rgba(184,134,43,.10), transparent 55%),
      radial-gradient(140% 120% at 50% 50%, transparent 52%, rgba(0,0,0,.72) 100%);
  }

  .card{
    position:relative; z-index:2;
    width:min(760px, 100%);
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:22px;
  }
  .fade{ transition:opacity 1.1s ease, transform 1.1s ease; }
  .is-hidden{ opacity:0; transform:translateY(10px); pointer-events:none; }

  .eyebrow{
    font-family:var(--disp); font-weight:600; font-size:clamp(.62rem,1.6vw,.78rem);
    letter-spacing:.42em; text-transform:uppercase; color:var(--goldsoft);
    padding-left:.42em;
  }
  .eyebrow .dot{color:var(--blood2)}

  /* emblem */
  .emblem{ width:clamp(148px, 30vw, 216px); height:auto; filter:drop-shadow(0 0 26px rgba(255,125,51,.28)); }
  .emblem .pulse{ transform-box:fill-box; transform-origin:center; animation:breathe 6s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{opacity:.9} 50%{opacity:1} }
  .float{ animation:float 9s ease-in-out infinite; }
  @keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

  h1{
    margin:0; font-family:var(--disp); font-weight:800;
    font-size:clamp(2.5rem, 9vw, 5.4rem); line-height:.98; letter-spacing:.06em;
    text-wrap:balance;
    background:linear-gradient(180deg, var(--gold2) 0%, var(--gold) 46%, #8a5f1c 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 2px 40px rgba(184,134,43,.18);
  }
  .rule{ display:flex; align-items:center; gap:14px; color:var(--gold); width:min(360px,80%); }
  .rule::before,.rule::after{ content:""; height:1px; flex:1; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
  .rule .diam{ width:7px; height:7px; background:var(--gold2); transform:rotate(45deg); box-shadow:0 0 10px rgba(227,192,114,.6) }
  .sub{
    font-family:var(--disp); font-weight:500; text-transform:uppercase;
    letter-spacing:.34em; font-size:clamp(.72rem,2.1vw,.98rem); color:var(--parchdim);
    padding-left:.34em; margin:0;
  }

  .enter{
    margin-top:8px; font-family:var(--disp); font-weight:600; letter-spacing:.2em; text-transform:uppercase;
    font-size:clamp(.78rem,2vw,.92rem); color:#faf3e2;
    background:linear-gradient(180deg,var(--blood2),var(--blood));
    border:1px solid var(--goldsoft); border-radius:2px;
    padding:14px 30px; cursor:pointer;
    box-shadow:0 0 0 0 rgba(255,125,51,.5), 0 10px 30px rgba(0,0,0,.5);
    transition:box-shadow .5s ease, transform .15s ease, background .3s;
  }
  .enter:hover{ transform:translateY(-1px); box-shadow:0 0 26px rgba(255,125,51,.4), 0 12px 34px rgba(0,0,0,.55); }
  .enter:focus-visible{ outline:2px solid var(--gold2); outline-offset:3px; }
  .hint{ font-size:.82rem; color:var(--parchdim); font-style:italic; letter-spacing:.02em; margin-top:-6px }

  /* narration */
  #tale{ position:relative; z-index:2; width:min(720px,100%); text-align:center; }
  .line{
    font-family:var(--body); font-style:italic; font-weight:500;
    font-size:clamp(1.35rem, 4.6vw, 2.2rem); line-height:1.32; color:var(--parch);
    margin:0; opacity:0; transform:translateY(14px);
    transition:opacity 1.4s ease, transform 1.4s ease;
    text-shadow:0 2px 30px rgba(0,0,0,.6);
    text-wrap:balance;
  }
  .line.show{ opacity:1; transform:none; }
  .line.dim{ opacity:.16; }
  .line b{ color:var(--gold2); font-weight:600; font-style:italic; }

  /* final card */
  #finale{ z-index:2 }
  .call{ font-family:var(--disp); font-weight:600; letter-spacing:.06em; font-size:clamp(1.1rem,3.4vw,1.7rem); color:var(--parch); margin:0; }
  .when{
    font-family:var(--disp); font-weight:800; letter-spacing:.05em;
    font-size:clamp(1.7rem,6.4vw,3rem);
    background:linear-gradient(180deg,var(--gold2),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:2px 0;
  }
  .bless{ font-family:var(--body); font-style:italic; color:var(--parchdim); font-size:clamp(1rem,2.6vw,1.2rem); margin:0; }
  .again{ background:none; border:1px solid var(--goldsoft); color:var(--goldsoft);
    font-family:var(--disp); letter-spacing:.16em; text-transform:uppercase; font-size:.72rem;
    padding:10px 20px; border-radius:2px; cursor:pointer; margin-top:10px; transition:.3s; }
  .again:hover{ background:rgba(184,134,43,.12); color:var(--gold2) }
  .again:focus-visible{ outline:2px solid var(--gold2); outline-offset:3px; }

  /* controls */
  #controls{ position:fixed; z-index:5; right:14px; top:calc(env(safe-area-inset-top,0px) + 14px); display:flex; gap:8px; }
  .ctl{ width:40px; height:40px; display:grid; place-items:center; cursor:pointer;
    background:rgba(20,11,9,.6); border:1px solid rgba(201,162,75,.4); border-radius:999px; color:var(--goldsoft);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); transition:.25s; }
  .ctl:hover{ color:var(--gold2); border-color:var(--gold2) }
  .ctl:focus-visible{ outline:2px solid var(--gold2); outline-offset:2px }
  .ctl svg{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round }
  .skip{ position:fixed; z-index:5; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
    background:none; border:none; color:var(--parchdim); font-family:var(--disp); letter-spacing:.18em;
    text-transform:uppercase; font-size:.68rem; cursor:pointer; transition:.2s; }
  .skip:hover{ color:var(--gold2) }

  @media (prefers-reduced-motion: reduce){
    .fade,.line{ transition:none !important; }
    .float,.emblem .pulse{ animation:none !important; }
  }
</style>

<canvas id="embers" aria-hidden="true"></canvas>

<div id="controls">
  <button class="ctl" id="sound" aria-pressed="false" title="Sonido" aria-label="Activar sonido">
    <svg viewBox="0 0 24 24" id="sicon"><path d="M4 9v6h4l5 4V5L8 9H4z"/><line x1="17" y1="9" x2="21" y2="15"/><line x1="21" y1="9" x2="17" y2="15"/></svg>
  </button>
</div>

<main id="stage">
  <!-- Title card -->
  <section class="card fade" id="title" aria-label="Alas de Sangre">
    <div class="eyebrow float">Alas de Sangre <span class="dot">&#9670;</span> Escuadr&oacute;n Iron Fist</div>
    <!-- Emblem: winged crest with flame -->
    <svg class="emblem float" viewBox="0 0 400 400" role="img" aria-label="Emblema de Basgiath: alas de dragón y llama">
      <defs>
        <linearGradient id="ggold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e3c072"/><stop offset="1" stop-color="#8a5f1c"/>
        </linearGradient>
        <radialGradient id="gember" cx="50%" cy="60%" r="60%">
          <stop offset="0" stop-color="#ffce8a"/><stop offset="45%" stop-color="#ff7d33"/><stop offset="100%" stop-color="#8c1a1f"/>
        </radialGradient>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="5"/>
        </filter>
      </defs>
      <!-- seal rings -->
      <circle cx="200" cy="200" r="150" fill="none" stroke="url(#ggold)" stroke-width="2" opacity=".55"/>
      <circle cx="200" cy="200" r="150" fill="none" stroke="#e3c072" stroke-width="2.5" stroke-dasharray="1.5 12" opacity=".8"/>
      <circle cx="200" cy="200" r="128" fill="none" stroke="url(#ggold)" stroke-width="3"/>
      <g class="pulse">
        <!-- wings (right, mirrored to left) -->
        <g stroke="url(#ggold)" stroke-width="4.2" fill="none" stroke-linecap="round">
          <g id="wing">
            <path d="M200,196 C238,176 286,168 330,150"/>
            <path d="M214,205 C250,196 292,196 332,188"/>
            <path d="M210,220 C246,220 286,232 320,232"/>
            <path d="M205,234 C232,244 262,262 286,286"/>
            <path d="M330,150 C338,166 336,182 332,188"/>
            <path d="M332,188 C330,204 324,220 320,232"/>
          </g>
          <use href="#wing" transform="matrix(-1,0,0,1,400,0)"/>
        </g>
        <!-- central flame / blood-drop -->
        <path d="M200,120
                 C224,158 244,182 244,214
                 C244,248 224,272 200,272
                 C176,272 156,248 156,214
                 C156,182 176,158 200,120 Z"
              fill="url(#gember)" filter="url(#soft)" opacity=".9"/>
        <path d="M200,132
                 C220,166 236,186 236,214
                 C236,244 220,264 200,264
                 C180,264 164,244 164,214
                 C164,186 180,166 200,132 Z"
              fill="none" stroke="#e3c072" stroke-width="2.6"/>
        <circle cx="200" cy="216" r="7" fill="#fff2d6"/>
      </g>
    </svg>

    <h1>Sesi&oacute;n III</h1>
    <div class="rule"><span class="diam"></span></div>
    <p class="sub">Presi&oacute;n</p>
    <button class="enter" id="enter">Ver el resumen</button>
    <p class="hint">súbele al volumen &#183; antes de empezar la partida</p>
  </section>

  <!-- Narration -->
  <section id="tale" class="card is-hidden" hidden aria-live="polite"></section>

  <!-- Finale -->
  <section id="finale" class="card fade is-hidden" hidden>
    <svg class="emblem" viewBox="0 0 400 400" aria-hidden="true"><use href="#wing" transform="matrix(-1,0,0,1,400,0)"/></svg>
    <p class="call">La presi&oacute;n comienza</p>
    <p class="when">Sesi&oacute;n III &#183; Lunes 8:00 PM</p>
    <p class="bless">Que no les tiemble la mano en el Parapeto.</p>
    <button class="again" id="again">Volver a ver</button>
  </section>
</main>

<button class="skip" id="skip" hidden>Saltar &#8594;</button>

<script>
(function(){
  "use strict";
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Embers canvas ---------- */
  var cv = document.getElementById('embers'), ctx = cv.getContext('2d');
  var W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2), parts=[], raf=null;
  function resize(){
    W=window.innerWidth; H=window.innerHeight;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function mk(){ return {x:Math.random()*W, y:H+Math.random()*40, r:Math.random()*1.8+.5,
    vy:-(Math.random()*.5+.18), vx:(Math.random()-.5)*.3, life:0, max:Math.random()*260+160,
    hue:Math.random()<.5?36:20 }; }
  function seed(n){ for(var i=0;i<n;i++){ var p=mk(); p.y=Math.random()*H; p.life=Math.random()*p.max; parts.push(p);} }
  function step(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<parts.length;i++){
      var p=parts[i]; p.life++; p.y+=p.vy; p.x+=p.vx; p.vx+=(Math.random()-.5)*.02;
      var t=p.life/p.max, a=Math.sin(t*Math.PI)*.8;
      ctx.beginPath();
      var g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);
      g.addColorStop(0,'rgba(255,'+(170+p.hue)+',120,'+a+')');
      g.addColorStop(1,'rgba(255,90,30,0)');
      ctx.fillStyle=g; ctx.arc(p.x,p.y,p.r*3,0,6.28); ctx.fill();
      if(p.life>=p.max||p.y< -10){ parts[i]=mk(); }
    }
    raf=requestAnimationFrame(step);
  }
  function start(){ if(raf||reduce) return; raf=requestAnimationFrame(step); }
  function stop(){ if(raf){cancelAnimationFrame(raf); raf=null;} }
  resize(); window.addEventListener('resize', resize);
  if(!reduce){ seed(70); start(); }
  else { seed(24); ctx.globalAlpha=.5; step(); stop(); }
  document.addEventListener('visibilitychange', function(){ document.hidden?stop():start(); });

  /* ---------- Ambient sound (generated, no files) ---------- */
  var AC=null, master=null, drone=[], heart=null, on=false;
  function buildAudio(){
    var Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    AC=new Ctx(); master=AC.createGain(); master.gain.value=0; master.connect(AC.destination);
    // low drone: two detuned oscillators through a lowpass
    var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=340; lp.connect(master);
    [55,55.4,82.5].forEach(function(f){
      var o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
      var g=AC.createGain(); g.gain.value=.06; o.connect(g); g.connect(lp); o.start(); drone.push(o);
    });
    // slow heartbeat
    heart=setInterval(function(){ if(!on||!AC) return;
      var t=AC.currentTime;
      [0,0.28].forEach(function(off){
        var o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(64,t+off);
        o.frequency.exponentialRampToValueAtTime(38,t+off+.18);
        var g=AC.createGain(); g.gain.setValueAtTime(0,t+off);
        g.gain.linearRampToValueAtTime(.5,t+off+.03); g.gain.exponentialRampToValueAtTime(.001,t+off+.34);
        o.connect(g); g.connect(master); o.start(t+off); o.stop(t+off+.4);
      });
    }, 2600);
  }
  function fade(to,secs){ if(!AC) return; var t=AC.currentTime;
    master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value,t);
    master.gain.linearRampToValueAtTime(to,t+secs); }
  function soundOn(){ if(!AC) buildAudio(); if(!AC) return; if(AC.state==='suspended') AC.resume();
    on=true; fade(.5,2.2); setPressed(true); }
  function soundOff(){ on=false; fade(0,.8); setPressed(false); }
  var sBtn=document.getElementById('sound'), sIcon=document.getElementById('sicon');
  function setPressed(v){ sBtn.setAttribute('aria-pressed', v?'true':'false');
    sIcon.innerHTML = v
      ? '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8 8 0 0 1 0 12"/>'
      : '<path d="M4 9v6h4l5 4V5L8 9H4z"/><line x1="17" y1="9" x2="21" y2="15"/><line x1="21" y1="9" x2="17" y2="15"/>'; }
  sBtn.addEventListener('click', function(){ on?soundOff():soundOn(); });

  /* ---------- Sequence ---------- */
  var LINES=[
    'El escuadr&oacute;n <b>Iron Fist</b> se gan&oacute; un nombre. <b>Auri Pendragon</b> los gu&iacute;a; <b>Dax</b> los entrena.',
    'Pero <b>Bottom</b> disputa el mando&hellip; y hay favores que empiezan a pesar como <b>cadenas</b>.',
    'Faltan d&iacute;as para la <b>Presentaci&oacute;n</b>: los dragones, el Gauntlet, el derecho a vivir.',
    'Y de noche, alguien se mueve entre secretos que Basgiath preferir&iacute;a <b>enterrar</b>.'
  ];
  var title=document.getElementById('title'), tale=document.getElementById('tale'),
      finale=document.getElementById('finale'), skip=document.getElementById('skip');
  var timers=[], nodes=[];
  function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
  function show(el){ el.hidden=false; requestAnimationFrame(function(){ el.classList.remove('is-hidden'); }); }
  function hide(el, cb){ el.classList.add('is-hidden'); timers.push(setTimeout(function(){ el.hidden=true; cb&&cb(); }, reduce?0:1100)); }

  function reveal(){
    // build lines
    tale.innerHTML=''; nodes=[];
    LINES.forEach(function(html){ var p=document.createElement('p'); p.className='line'; p.innerHTML=html; tale.appendChild(p); nodes.push(p); });
    show(tale); skip.hidden=false;
    if(reduce){ nodes.forEach(function(n){ n.classList.add('show'); }); timers.push(setTimeout(toFinale, 300)); return; }
    var t=400, hold=3100;
    nodes.forEach(function(n, i){
      timers.push(setTimeout(function(){
        nodes.forEach(function(o){ o.classList.add('dim'); o.classList.remove('show'); });
        n.classList.add('show'); n.classList.remove('dim');
      }, t));
      t+=hold;
    });
    timers.push(setTimeout(toFinale, t+200));
  }
  function toFinale(){
    clearTimers(); skip.hidden=true;
    hide(tale, function(){ show(finale); });
  }
  function begin(){
    clearTimers();
    if(!on) soundOn();               // gesture → audio allowed
    hide(title, function(){ reveal(); });
  }
  function replay(){
    clearTimers();
    finale.classList.add('is-hidden'); finale.hidden=true;
    tale.classList.add('is-hidden'); tale.hidden=true;
    show(title);
  }
  document.getElementById('enter').addEventListener('click', begin);
  document.getElementById('again').addEventListener('click', replay);
  skip.addEventListener('click', toFinale);
})();
</script>

</body>
</html>
